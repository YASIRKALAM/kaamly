# ==============================================================================
# Kaamly Local Development Nginx Configuration (HTTP Gateway)
# ==============================================================================

upstream php_backend {
    server backend:9000;
}

upstream reverb_websocket {
    server reverb:8080;
}

upstream nextjs_admin {
    server admin_portal:3000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50M;

    # 1. Laravel Reverb Real-Time WebSockets Proxy
    location /app {
        proxy_pass http://reverb_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Next.js 16 Admin Web Portal
    location /admin {
        proxy_pass http://nextjs_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static asset chunk optimization
    location /_next {
        proxy_pass http://nextjs_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Laravel Core REST API & Web Routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # 5. Security: Deny access to hidden dotfiles and sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|\.git|composer\.|package\.) {
        deny all;
        return 404;
    }
}
