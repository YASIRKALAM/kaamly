# ==============================================================================
# Kaamly Production Nginx Configuration (TLS / SSL Termination Gateway)
# ==============================================================================

upstream php_backend_prod {
    server backend:9000;
}

upstream reverb_websocket_prod {
    server reverb:8080;
}

upstream nextjs_admin_prod {
    server admin_portal:3000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.kaamly.com admin.kaamly.com ws.kaamly.com;
    return 301 https://$host$request_uri;
}

# Production HTTPS Gateway
server {
    listen 443 ssl http2;
    server_name api.kaamly.com admin.kaamly.com ws.kaamly.com;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50M;

    # SSL / TLS Certificate Configuration
    ssl_certificate /etc/ssl/certs/kaamly.crt;
    ssl_certificate_key /etc/ssl/private/kaamly.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 1. Laravel Reverb WebSocket Gateway
    location /app {
        proxy_pass http://reverb_websocket_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Next.js 16 Production Admin Portal
    location /admin {
        proxy_pass http://nextjs_admin_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /_next {
        proxy_pass http://nextjs_admin_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Laravel Core REST API
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_pass php_backend_prod;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # 5. Block Access to Hidden & Sensitive Files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|\.git|composer\.|package\.) {
        deny all;
        return 404;
    }
}
