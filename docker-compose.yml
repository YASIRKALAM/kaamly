# ==============================================================================
# KAAMLY PLATFORM - DOCKER COMPOSE (LOCAL DEVELOPMENT ENVIRONMENT)
# ==============================================================================
# Usage:
#   cp .env.example .env
#   docker compose up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE: PostgreSQL 16 + PostGIS Spatial Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kaamly_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE required in .env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME required in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Bind strictly to local loopback (127.0.0.1) for local GUI tools (Navicat, pgAdmin)
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/01-init-postgis.sh:/docker-entrypoint-initdb.d/01-init-postgis.sh:ro
    networks:
      - kaamly_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. CACHE & QUEUE BROKER: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kaamly_redis_dev
    restart: unless-stopped
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}
    # Bind strictly to local loopback (127.0.0.1)
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - kaamly_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. OBJECT STORAGE: MinIO (S3 Compatible Storage)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: kaamly_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    networks:
      - kaamly_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. MINIO INITIALIZER: Creates Buckets & Scoped App Credentials
  # ----------------------------------------------------------------------------
  minio_init:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    container_name: kaamly_minio_init_dev
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      MINIO_APP_USER: ${MINIO_APP_USER:?MINIO_APP_USER required}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD required}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-kaamly-private-docs}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-kaamly-public-assets}
    volumes:
      - ./infrastructure/docker/minio/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks:
      - kaamly_internal

  # ----------------------------------------------------------------------------
  # 5. CORE API BACKEND: Laravel 13 (PHP 8.3-FPM)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./infrastructure/docker/php
      dockerfile: Dockerfile
    container_name: kaamly_backend_dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: "${APP_NAME:-Kaamly}"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?APP_KEY required}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      # Application scoped S3 credentials (NOT Root MinIO credentials)
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_APP_USER:?MINIO_APP_USER required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD required}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_PRIVATE_BUCKET:-kaamly-private-docs}
      AWS_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-kaamly-public-assets}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    networks:
      - kaamly_internal

  # ----------------------------------------------------------------------------
  # 6. REAL-TIME ENGINE: Laravel Reverb WebSockets
  # ----------------------------------------------------------------------------
  reverb:
    build:
      context: ./infrastructure/docker/php
      dockerfile: Dockerfile
    container_name: kaamly_reverb_dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: "${APP_NAME:-Kaamly}"
      APP_ENV: local
      APP_KEY: ${APP_KEY:?APP_KEY required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID required}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY required}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET required}
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: "http"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - kaamly_internal

  # ----------------------------------------------------------------------------
  # 7. ASYNC WORKERS: Laravel Queue Worker (Graceful Lifecycle)
  # ----------------------------------------------------------------------------
  queue_worker:
    build:
      context: ./infrastructure/docker/php
      dockerfile: Dockerfile
    container_name: kaamly_queue_worker_dev
    restart: unless-stopped
    working_dir: /var/www/html
    # Graceful queue management: max execution duration, retry ceiling, memory ceiling
    command: >
      php artisan queue:work redis 
      --sleep=3 
      --tries=3 
      --timeout=90 
      --max-time=3600 
      --max-jobs=1000 
      --memory=256 
      --rest=1
    stop_signal: SIGTERM
    stop_grace_period: 60s
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: "${APP_NAME:-Kaamly}"
      APP_ENV: local
      APP_KEY: ${APP_KEY:?APP_KEY required}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      QUEUE_CONNECTION: redis
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - kaamly_internal

  # ----------------------------------------------------------------------------
  # 8. ADMIN WEB PORTAL: Next.js 16 (Node 22 LTS Dev Mode)
  # ----------------------------------------------------------------------------
  admin_portal:
    image: node:22-alpine
    container_name: kaamly_admin_portal_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./admin-portal:/app
    environment:
      NODE_ENV: development
      # Public browser endpoints (External Gateway)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/app}
      # Internal server-side API communication
      INTERNAL_API_URL: http://nginx/api/v1
    command: sh -c "if [ ! -d 'node_modules' ]; then npm install; fi && npm run dev -- -p 3000"
    networks:
      - kaamly_internal

  # ----------------------------------------------------------------------------
  # 9. EDGE GATEWAY: Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: kaamly_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/kaamly-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - reverb
      - admin_portal
    networks:
      - kaamly_internal

networks:
  kaamly_internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
